name: Build incremental release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/language.php
          php tests/updater.php
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          version = re.search(r"public const VERSION = '([^']+)';", Path('Plugin.php').read_text(encoding='utf-8')).group(1)
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag and Plugin::VERSION must match')
          subprocess.run(['python', 'tools/build_release.py', '--version', version, '--commit', os.environ['GITHUB_SHA'], '--out', 'dist'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CommentAudit-release-assets
          path: dist/
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "CommentAudit ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/CommentAudit-*.zip dist/commentaudit-update.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
